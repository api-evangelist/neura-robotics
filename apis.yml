aid: neura-robotics
name: NEURA Robotics
description: 'NEURA Robotics is a German deep-tech company building cognitive and humanoid
  robots for industry, business, and everyday life. It develops robots such as the 4NE-1
  humanoid and the MAiRA, MiPA, LARA, and MAV cognitive cobots, powered by its proprietary
  AI system AURA. Its Neuraverse ecosystem is a connected platform and app marketplace that
  links robots, developers, and partners so AI models, applications, and hardware come together
  to make the robots smarter. NEURA Robotics is backed by HV Capital. As of this profile the
  company exposes no public, documented developer API: neuraverse.com is a gated single-page
  application portal, and no OpenAPI, developer documentation, or well-known discovery endpoints
  are published on its public surface.'
